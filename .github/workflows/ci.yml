name: CI — Lint, Typecheck, Security Tests & Production Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify ESLint, TypeScript, Security Tests & Next.js Build (Node 24)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint static analysis
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Automated Security & Engine Unit Tests
        run: npm test

      - name: Build production bundle
        run: npm run build
