name: Release — Package Signed Multi-NAS Bundle & GHCR Image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Test, Build & Package Release Artifacts (Isolated Read-Only)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository (no persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tagged commit belongs to main branch (U6)
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::Tagged commit ${GITHUB_SHA} is NOT reachable from origin/main! Refusing to build or sign."
            exit 1
          fi

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies without lifecycle scripts (U7)
        run: npm ci --ignore-scripts

      - name: Lint, typecheck, security tests & production build
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Verify clean source tree & package release bundles (U7)
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::Tracked source files were unexpectedly modified during build/test!"
            git status --short
            exit 1
          fi
          sudo apt-get update && sudo apt-get install -y zip
          npm run pack:release
          node scripts/package-prebuilt.mjs

      - name: Upload unsigned release bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nas-sync-release-bundle
          path: |
            release/nas-sync-bundle.zip
            release/nas-sync-bundle.zip.sha256
            release/nas-sync-bundle.tar.gz
            release/nas-sync-bundle.tar.gz.sha256
            release/nas-sync-prebuilt.tar.gz
            release/nas-sync-prebuilt.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Sign Ed25519 Release & Publish to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout signing script & verify main ancestry (no npm install)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            scripts/sign-release.mjs
            src/lib/release-public-key.mjs
          sparse-checkout-cone-mode: false

      - name: Re-verify tagged commit belongs to main branch before accessing signing key (U6)
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::Tagged commit ${GITHUB_SHA} is NOT on origin/main! Aborting Ed25519 signing."
            exit 1
          fi

      - name: Setup Node.js 24 (clean runner, no npm install)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Download verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nas-sync-release-bundle
          path: release

      - name: Verify SHA-256 & Sign Prebuilt + Bundle Archives with Ed25519 (U9, U16)
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          CI: 'true'
        run: node scripts/sign-release.mjs --tag "${GITHUB_REF_NAME}"

      - name: Generate SLSA Build Provenance Attestation (U7)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release/nas-sync-prebuilt.tar.gz
            release/nas-sync-bundle.tar.gz
            release/nas-sync-bundle.zip

      - name: Publish Signed GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            release/nas-sync-bundle.zip
            release/nas-sync-bundle.zip.sha256
            release/nas-sync-bundle.tar.gz
            release/nas-sync-bundle.tar.gz.sha256
            release/nas-sync-bundle.tar.gz.sig
            release/nas-sync-prebuilt.tar.gz
            release/nas-sync-prebuilt.tar.gz.sha256
            release/nas-sync-prebuilt.tar.gz.sig

  docker-ghcr:
    name: Build & Push Multi-Arch GHCR Docker Image (amd64 + arm64)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository (no persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Extract clean release version
        id: ver
        run: |
          RAW_TAG="${GITHUB_REF_NAME:-latest}"
          CLEAN_VER="${RAW_TAG#v}"
          echo "clean=${CLEAN_VER}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Multi-Arch GHCR image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/shostwp-byte/nas-sync:latest
            ghcr.io/shostwp-byte/nas-sync:${{ steps.ver.outputs.clean }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
