name: Release — Package Synology NAS Bundle & GHCR Image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Attach Synology Deployment Archives
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies, run tests & verify build
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Package Synology ZIP, TAR.GZ & Prebuilt SHA-256 bundles
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          npm run pack:synology
          node scripts/package-prebuilt.mjs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/nas-sync-synology.zip
            release/nas-sync-synology.tar.gz
            release/nas-sync-prebuilt.tar.gz
            release/nas-sync-prebuilt.tar.gz.sha256

  docker-ghcr:
    name: Build & Push Multi-Arch GHCR Docker Image (amd64 + arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract clean release version
        id: ver
        run: |
          RAW_TAG="${GITHUB_REF_NAME:-latest}"
          CLEAN_VER="${RAW_TAG#v}"
          echo "clean=${CLEAN_VER}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Multi-Arch GHCR image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/shostwp-byte/nas-sync:latest
            ghcr.io/shostwp-byte/nas-sync:${{ steps.ver.outputs.clean }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
