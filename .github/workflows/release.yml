name: Release — Package Synology NAS Bundle

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Attach Synology Deployment Archives
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies & verify build
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Package Synology ZIP & TAR.GZ bundles
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          npm run pack:synology

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/nas-sync-synology.zip
            release/nas-sync-synology.tar.gz

