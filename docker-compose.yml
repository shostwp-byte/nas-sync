services:
  redis:
    image: redis:7-alpine
    container_name: nas_sync_redis
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    entrypoint: ["redis-server", "--appendonly", "yes"]
    volumes:
      - nas_sync_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  db_sandbox:
    image: mariadb:10.11
    container_name: nas_sync_sandbox
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      - MYSQL_ROOT_PASSWORD=${SANDBOX_DB_PASSWORD:-sandbox_secret_pass}
    tmpfs:
      - /var/lib/mysql:rw,noexec,nosuid,size=1g

  app:
    build: .
    # Có thể chuyển từ `build: .` sang Docker Image dựng sẵn đa kiến trúc (amd64/arm64) trên GHCR nếu muốn khởi chạy tức thì:
    # image: ghcr.io/shostwp-byte/nas-sync:latest
    container_name: nas_sync_core
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    ports:
      - "${APP_HOST_PORT:-3080}:3000"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Ho_Chi_Minh
      - APP_URL=${APP_URL:-http://localhost:3080}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - DATA_DIR=/app/data
      - SSH_KEYS_DIR=/app/ssh_keys
      - REDIS_URL=redis://redis:6379
      - SANDBOX_DB_HOST=db_sandbox
      - SANDBOX_DB_PORT=3306
      - SANDBOX_DB_USER=root
      - SANDBOX_DB_PASSWORD=${SANDBOX_DB_PASSWORD:-sandbox_secret_pass}
      - STORAGE_VOLUMES=${STORAGE_VOLUMES:-/mnt/vol1}
      - VOLUME_MAX_USAGE_PERCENT=${VOLUME_MAX_USAGE_PERCENT:-85}
      - VOLUME_MIN_FREE_GB=${VOLUME_MIN_FREE_GB:-10}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-nas-sync@2026}
      # Để trống: tự sinh khóa ngẫu nhiên lưu tại /app/data/.jwt_secret
      - JWT_SECRET=${JWT_SECRET:-}
      - GITHUB_REPO_OWNER=${GITHUB_REPO_OWNER:-shostwp-byte}
      - GITHUB_REPO_NAME=${GITHUB_REPO_NAME:-nas-sync}
      - GITHUB_REPO_BRANCH=${GITHUB_REPO_BRANCH:-main}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@example.com}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - WORM_PROVIDER=${WORM_PROVIDER:-NONE}
      - WORM_API_URL=${WORM_API_URL:-}
      - WORM_API_KEY=${WORM_API_KEY:-}
      - WORM_USERNAME=${WORM_USERNAME:-}
      - WORM_PASSWORD=${WORM_PASSWORD:-}
      - WORM_TARGET_SHARES=${WORM_TARGET_SHARES:-VPS_Backups}
      - WORM_WEBHOOK_SECRET=${WORM_WEBHOOK_SECRET:-}
      - WORM_TLS_VERIFY=${WORM_TLS_VERIFY:-true}
    volumes:
      - ./app_data:/app/data
      - ./ssh_keys:/app/ssh_keys
      - ${NAS_VOL1_PATH:-/volume1/VPS_Backups}:/mnt/vol1
      # Bỏ dấu # dòng dưới nếu NAS có thêm phân vùng lưu trữ thứ 2:
      # - ${NAS_VOL2_PATH:-/volume2/VPS_Backups}:/mnt/vol2
    depends_on:
      redis:
        condition: service_healthy
      db_sandbox:
        condition: service_started

volumes:
  nas_sync_redis_data:
